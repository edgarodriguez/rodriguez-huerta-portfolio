<!-- Serif — EB Garamond (Google Fonts) -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<!-- Sans — Switzer (Fontshare). Weights 400/500 match the old Space Grotesk load. -->
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet">
<!-- Mono — Commit Mono (Fontsource via jsDelivr). Taller x-height than Space Mono,
     so the small mono labels read larger at the same px value. -->
<link href="https://cdn.jsdelivr.net/npm/@fontsource/commit-mono@5.3.0/index.css" rel="stylesheet">
<script>
  // Apply default editorial palette; persists user toggle in localStorage.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('edgar-palette'); } catch (e) {}
    document.documentElement.setAttribute('data-palette', saved || 'editorial-light');
  })();
</script>
